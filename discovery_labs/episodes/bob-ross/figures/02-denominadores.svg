<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="ttl descr"><title id="ttl">La pregunta cambia con el denominador</title><desc id="descr">Barras porcentuales: anfitrión con árboles 345/381, invitados 16/22 y nieve en montañas 102/150.</desc><rect width="960" height="470" fill="#101b27"/><text x="40" y="55" fill="#f4ecda" font-family="Arial, sans-serif" font-size="26" font-weight="700">La pregunta cambia con el denominador</text><text x="40" y="110" fill="#edf4f3" font-family="Arial" font-size="18">Árboles · anfitrión</text><rect x="40" y="126" width="680" height="30" rx="6" fill="#2c4353"/><rect x="40" y="126" width="615.75" height="30" rx="6" fill="#86bfca"/><text x="745" y="149" fill="#f2eddf" font-family="Arial" font-size="18">345/381 · 90.6%</text><text x="40" y="215" fill="#edf4f3" font-family="Arial" font-size="18">Árboles · invitados</text><rect x="40" y="231" width="680" height="30" rx="6" fill="#2c4353"/><rect x="40" y="231" width="494.55" height="30" rx="6" fill="#d29b73"/><text x="745" y="254" fill="#f2eddf" font-family="Arial" font-size="18">16/22 · 72.7%</text><text x="40" y="320" fill="#edf4f3" font-family="Arial" font-size="18">Montañas con nieve</text><rect x="40" y="336" width="680" height="30" rx="6" fill="#2c4353"/><rect x="40" y="336" width="462.40" height="30" rx="6" fill="#b7a7d4"/><text x="745" y="359" fill="#f2eddf" font-family="Arial" font-size="18">102/150 · 68.0%</text><text x="40" y="442" fill="#c2d1d9" font-family="Arial, sans-serif" font-size="13">Invitados n=22 · descriptivo, no causal · SNOWY_MOUNTAIN activa montaña y nieve</text></svg>
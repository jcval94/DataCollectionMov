<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="ttl descr"><title id="ttl">Cuatro salas de museo: ¿cómo repartir los episodios?</title><desc id="descr">Clasificación ficticia basada en orden de reglas, salas Agua, Montañas, Bosques y Otros. No hay rentabilidad observada.</desc><rect width="960" height="500" fill="#101b27"/><text x="40" y="55" fill="#f4ecda" font-family="Arial, sans-serif" font-size="26" font-weight="700">Cuatro salas de museo: ¿cómo repartir los episodios?</text><text x="40" y="88" fill="#b1c8d2" font-family="Arial" font-size="15">Regla: agua/costa → montañas → árboles → otros · 381 episodios</text><text x="40" y="130" fill="#edf4f3" font-family="Arial" font-size="19">Agua y costa</text><rect x="40" y="143" width="770" height="25" rx="6" fill="#2c4353"/><rect x="40" y="143" width="145.51" height="25" rx="6" fill="#86bfca"/><text x="841" y="163" fill="#f2eddf" font-family="Arial" font-size="18">72</text><text x="40" y="205" fill="#edf4f3" font-family="Arial" font-size="19">Montañas</text><rect x="40" y="218" width="770" height="25" rx="6" fill="#2c4353"/><rect x="40" y="218" width="272.83" height="25" rx="6" fill="#d29b73"/><text x="841" y="238" fill="#f2eddf" font-family="Arial" font-size="18">135</text><text x="40" y="280" fill="#edf4f3" font-family="Arial" font-size="19">Bosques</text><rect x="40" y="293" width="770" height="25" rx="6" fill="#2c4353"/><rect x="40" y="293" width="341.55" height="25" rx="6" fill="#a5c994"/><text x="841" y="313" fill="#f2eddf" font-family="Arial" font-size="18">169</text><text x="40" y="355" fill="#edf4f3" font-family="Arial" font-size="19">Otros paisajes</text><rect x="40" y="368" width="770" height="25" rx="6" fill="#2c4353"/><rect x="40" y="368" width="10.10" height="25" rx="6" fill="#b6a6d4"/><text x="841" y="388" fill="#f2eddf" font-family="Arial" font-size="18">5</text><text x="40" y="472" fill="#c2d1d9" font-family="Arial, sans-serif" font-size="13">Escenario operativo inventado · sin costos, entradas, demanda ni inferencia de rentabilidad</text></svg>
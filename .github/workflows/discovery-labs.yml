name: AI Discovery Labs · integridad y pilotos
on:
  pull_request:
    paths:
      - 'discovery_labs/**'
      - '.github/workflows/discovery-labs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery-labs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: discovery_labs/requirements-ci.txt
      - run: python -m pip install -r discovery_labs/requirements-ci.txt
      - run: python discovery_labs/scripts/run_pilots.py
      - run: python discovery_labs/scripts/build_catalog.py
      - run: python discovery_labs/scripts/finalize_evidence.py
      - run: python discovery_labs/scripts/build_delivery.py
      - run: python -m unittest discover -s discovery_labs/tests -v
      - run: node discovery_labs/tests/dashboard_logic.cjs
      - name: Catálogos reproducibles
        run: git diff --exit-code -- discovery_labs/catalog
      - run: python -m playwright install --with-deps chromium
      - run: python discovery_labs/tests/dashboard_browser.py
      - name: Evidencia de navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-dashboard-browser-qa
          path: discovery_labs/test-output/
          if-no-files-found: ignore
